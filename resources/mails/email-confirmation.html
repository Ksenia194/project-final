<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{email.confirmation.title}">JiraRush - Email Confirmation</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<p th:text="#{email.confirmation.greeting(${user.firstName})}">Hello, User.</p>
<p th:text="#{email.confirmation.message}">To complete your account setup and start using JiraRush, please confirm that you have entered your email address correctly.</p>
<a th:href="${confirmationUrl}" th:text="#{email.confirmation.button}">Confirm Email</a>
</body>
</html>

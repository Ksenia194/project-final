<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="authUser" type="com.javarush.jira.login.AuthUser"*/-->

<th:block th:replace="~{layout/main::page(title=#{app.title} + ': ' + #{app.subtitle},appMain=~{::appMain})}">
    <appMain>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="#{index.title}">JiraRush Home page</h1>
            <div class="language-selector">
                <a th:href="@{''(lang='en')}" class="btn btn-outline-secondary btn-sm me-1">EN</a>
                <a th:href="@{''(lang='uk')}" class="btn btn-outline-secondary btn-sm me-1">УК</a>
                <a th:href="@{''(lang='cs')}" class="btn btn-outline-secondary btn-sm">CS</a>
            </div>
        </div>
        
        <div th:if="${authUser} != null">
            <form action="/ui/logout" method="post">
                <button class="btn btn-primary btn-lg mt-3" type="submit" th:text="#{index.logout.button}">Logout</button>
            </form>
        </div>
    </appMain>
</th:block>

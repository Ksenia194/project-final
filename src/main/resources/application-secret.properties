# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:default_github_id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:default_github_secret}
spring.security.oauth2.client.registration.github.scope=email

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default_google_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default_google_secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# GitLab OAuth2
spring.security.oauth2.client.registration.gitlab.client-id=${GITLAB_CLIENT_ID:default_gitlab_id}
spring.security.oauth2.client.registration.gitlab.client-secret=${GITLAB_CLIENT_SECRET:default_gitlab_secret}
spring.security.oauth2.client.registration.gitlab.client-name=GitLab
spring.security.oauth2.client.registration.gitlab.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.gitlab.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gitlab.scope=read_user

# GitLab Provider
spring.security.oauth2.client.provider.gitlab.authorization-uri=https://gitlab.com/oauth/authorize
spring.security.oauth2.client.provider.gitlab.token-uri=https://gitlab.com/oauth/token
spring.security.oauth2.client.provider.gitlab.user-info-uri=https://gitlab.com/api/v4/user
spring.security.oauth2.client.provider.gitlab.user-name-attribute=email

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/jira
spring.datasource.username=${DB_USERNAME:jira}
spring.datasource.password=${DB_PASSWORD:JiraRush}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.username=${MAIL_USERNAME:jira4jr@gmail.com}
spring.mail.password=${MAIL_PASSWORD:default_mail_password}
spring.mail.port=587
